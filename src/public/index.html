<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>顺序选择</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <main>
    <h1 id="project-title">顺序选择</h1>
    <p id="connection" role="status" hidden></p>
    <section>
      <h2>当前情况</h2>
      <p id="current">正在加载…</p>
      <p id="schedule"></p>
      <p id="countdown" role="timer"></p>
      <div id="options" class="options"></div>
      <h3>选择情况</h3>
      <table id="results"><thead><tr><th>位置</th><th>姓名</th><th>组名</th><th>当前选择</th></tr></thead><tbody id="history"></tbody></table>
    </section>
    <section>
      <div class="heading"><h2>账户</h2><button id="logout" type="button" hidden>退出</button></div>
      <form id="login-form">
        <label for="token">Token</label>
        <input id="token" type="password" autocomplete="off" minlength="10" maxlength="10" required>
        <button id="login-button" type="submit">登录</button>
      </form>
      <div id="identity" hidden><h3 id="my-name"></h3><div id="position-picker" hidden><label for="position">我的位置</label><select id="position"></select></div><p id="my-status"></p></div>
      <form id="preferences-form" hidden>
        <h3>倾向排列</h3>
        <p id="selection-preview" role="status"></p>
        <ol id="ranking"></ol>
        <button id="save-preferences" type="submit">确认排列</button>
        <span id="preferences-status"></span>
        <span>（确认后、锁定前仍可修改和重新确认）</span>
      </form>
      <p id="message" role="status" hidden></p>
    </section>
    <section>
      <h2>设置</h2>
      <label for="theme">显示模式</label>
      <select id="theme"><option value="light">亮色</option><option value="dark">暗色</option></select>
      <form id="settings-form" hidden>
        <label for="start-at">开始时刻（本机时区，留空为待设置）</label>
        <input id="start-at" type="datetime-local" step="1">
        <label for="interval">锁定间隔（秒）</label>
        <input id="interval" type="number" min="1" max="86400" step="1" required>
        <button id="save-settings" type="submit">保存设置</button>
        <p id="settings-status"></p>
      </form>
    </section>
  </main>
</body>
</html>
